name: Publish Release APK

# Takes the APK produced by "Build MX-style VLC APK" and attaches it to a GitHub
# release. Running the upload on a runner avoids pushing a ~130 MB binary through
# a slow client connection.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, must already exist (e.g. v3.15.2)'
        required: true
        default: 'v3.15.2'
      run_id:
        description: 'Build run id (empty = latest successful run of workflow_file)'
        required: false
        default: ''
      workflow_file:
        description: 'Workflow that produced the artifact'
        required: true
        default: 'build-apk.yml'
        type: choice
        options:
          - build-apk.yml
      artifact_name:
        description: 'Artifact name to download'
        required: true
        default: 'vlc-mx-release-apk'
        type: choice
        options:
          - vlc-mx-release-apk
          - vlc-mx-debug-apk
      apk_suffix:
        description: 'Suffix used in the uploaded file name'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Attach APK to release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
      RUN_ID_INPUT: ${{ inputs.run_id }}
      WORKFLOW_FILE: ${{ inputs.workflow_file }}
      ARTIFACT_NAME: ${{ inputs.artifact_name }}
      APK_SUFFIX: ${{ inputs.apk_suffix }}
    steps:
      - name: Resolve build run
        id: resolve
        run: |
          RUN_ID="$RUN_ID_INPUT"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow="$WORKFLOW_FILE" \
              --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
          fi
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using build run: $RUN_ID ($WORKFLOW_FILE)"

      - name: Download APK artifact
        run: |
          mkdir -p dist
          gh run download "${{ steps.resolve.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" -n "$ARTIFACT_NAME" -D dist
          find dist -type f -printf '%10s  %p\n' | sort -k2

      - name: Upload APK to release
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find dist -name '*.apk' -type f | sort)
          test "${#APKS[@]}" -gt 0
          echo "Found ${#APKS[@]} APK(s)"
          UPLOADS=()
          for APK in "${APKS[@]}"; do
            BASE=$(basename "$APK" .apk)
            # Upstream names per-ABI splits <name>-<abi>, keep that suffix so the
            # four release assets stay distinguishable on the release page.
            ABI=""
            for CANDIDATE in armeabi-v7a arm64-v8a x86_64 x86 all; do
              case "$BASE" in
                *-"$CANDIDATE") ABI="$CANDIDATE"; break ;;
              esac
            done
            # Release builds are never named "-debug", so strip a trailing -all.
            if [ "$ABI" = "all" ]; then
              OUT="VLC-MX-${TAG}-${APK_SUFFIX}.apk"
            elif [ -n "$ABI" ]; then
              OUT="VLC-MX-${TAG}-${ABI}-${APK_SUFFIX}.apk"
            else
              OUT="VLC-MX-${TAG}-${BASE##*-}-${APK_SUFFIX}.apk"
            fi
            cp "$APK" "$OUT"
            echo "  $(basename "$APK")  ->  $OUT"
            UPLOADS+=("$OUT")
          done
          ls -l "${UPLOADS[@]}"
          gh release upload "$TAG" "${UPLOADS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          echo "--- assets on $TAG ---"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | "\(.name)  \(.size) bytes  state=\(.state)"'
